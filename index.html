<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Próximo Viaje - Dashboard USA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }

        /* Contenedor principal con la bandera de EE.UU. de fondo */
        .dashboard-banner {
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.25)), 
                        url('https://images.unsplash.com/photo-1508433957232-3107f5ed20be?q=80&w=1200&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            width: 95%;
            max-width: 850px;
            padding: 50px 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            border: 4px solid #ffffff;
        }

        /* Título "MI PRÓXIMO VIAJE" con sombra para legibilidad */
        .title {
            color: #ffffff;
            font-size: 3.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 35px;
            text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.7);
        }

        /* Contenedor de los bloques numéricos */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        /* Bloques individuales (Tarjetas blancas idénticas a la imagen) */
        .time-box {
            background-color: rgba(252, 251, 247, 0.95);
            color: #111424;
            width: 130px;
            height: 130px;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            transition: transform 0.2s;
        }

        .time-box:hover {
            transform: scale(1.03);
        }

        .number {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1;
        }

        .label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #444444;
            text-transform: uppercase;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        /* Adaptabilidad para teléfonos móviles */
        @media (max-width: 650px) {
            .title {
                font-size: 2.2rem;
                margin-bottom: 25px;
            }
            .countdown-container {
                gap: 12px;
            }
            .time-box {
                width: 100px;
                height: 100px;
                border-radius: 20px;
            }
            .number {
                font-size: 2rem;
            }
            .label {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-banner">
        <h1 class="title">Mi Próximo Viaje</h1>
        
        <div class="countdown-container">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Días</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Horas</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutos</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Segundos</span>
            </div>
        </div>
    </div>

    <script>
        // Fecha exacta de inicio: 27 de Junio de 2026 a las 05:00 AM
        const targetDate = new Date('June 27, 2026 05:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            // Si ya llegó la fecha de inicio del viaje
            if (difference <= 0) {
                document.querySelector('.title').innerText = "¡Buen Viaje a USA!";
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                clearInterval(countdownInterval);
                return;
            }

            // Fórmulas matemáticas para desglosar el tiempo restante
            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            // Muestra siempre el formato visual de dos dígitos (ej: "09" en vez de "9")
            document.getElementById('days').innerText = d < 10 ? '0' + d : d;
            document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
            document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
            document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
        }

        // Ejecución inicial automática y actualización en tiempo real cada 1 segundo
        updateCountdown();
        const countdownInterval = setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
