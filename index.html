<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Próximo Viaje - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f9;
        }

        /* Contenedor principal inspirado en image.png */
        .dashboard-banner {
            background: linear-gradient(135deg, #ff3b30, #e60000);
            width: 90%;
            max-width: 800px;
            padding: 40px 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        /* Detalles estéticos de fondo */
        .dashboard-banner::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 150px;
            height: 150px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .dashboard-banner::after {
            content: '';
            position: absolute;
            bottom: -60px;
            right: -60px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 50%;
        }

        /* Título solicitado */
        .title {
            color: #ffffff;
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        /* Contenedor de los bloques numéricos */
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        /* Bloques individuales (Tarjetas blancas) */
        .time-box {
            background-color: #fcfbf7;
            color: #1a1a2e;
            width: 120px;
            height: 120px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .number {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
        }

        .label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #555555;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* Adaptabilidad para pantallas pequeñas */
        @media (max-width: 600px) {
            .title {
                font-size: 2rem;
            }
            .time-box {
                width: 90px;
                height: 90px;
                border-radius: 16px;
            }
            .number {
                font-size: 1.8rem;
            }
            .label {
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-banner">
        <h1 class="title">Nuestro Próximo Viaje a:</h1>
        
        <div class="countdown-container">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Días</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Horas</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minutos</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Segundos</span>
            </div>
        </div>
    </div>

    <script>
        // Fecha y hora del viaje: 27 de Junio de 2026 a las 05:00 AM
        const targetDate = new Date('June 27, 2026 05:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.querySelector('.title').innerText = "¡Buen Viaje!";
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                clearInterval(countdownInterval);
                return;
            }

            // Cálculos de tiempo
            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            // Formato para asegurar siempre dos dígitos (ej. "09" en lugar de "9")
            document.getElementById('days').innerText = d < 10 ? '0' + d : d;
            document.getElementById('hours').innerText = h < 10 ? '0' + h : h;
            document.getElementById('minutes').innerText = m < 10 ? '0' + m : m;
            document.getElementById('seconds').innerText = s < 10 ? '0' + s : s;
        }

        // Ejecutar inmediatamente y luego actualizar cada segundo
        updateCountdown();
        const countdownInterval = setInterval(updateCountdown, 1000);
    </script>

</body>
</html>
